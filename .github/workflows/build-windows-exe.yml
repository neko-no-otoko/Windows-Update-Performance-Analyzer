name: Build Windows GUI executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Gui/**"
      - "Build/**"
      - "Modules/**"
      - "Data/**"
      - "Assets/**"
      - "Tests/**"
      - "docs/**"
      - "*.ps1"
      - "*.cmd"
      - "*.md"
      - "VERSION"
      - "BundleManifest.sha256"
      - ".gitattributes"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify embedded payload manifest
        shell: pwsh
        run: ./Build/Update-BundleManifest.ps1 -Verify

      - name: Run cross-platform regression tests
        shell: pwsh
        run: |
          $tests = @(
            './Tests/Invoke-V200Tests.ps1',
            './Tests/Invoke-V300Tests.ps1'
            './Tests/Invoke-UpgradeIdentityTests.ps1'
            './Tests/Invoke-V320ReportTests.ps1'
            './Tests/Invoke-V320MigrationTests.ps1'
            './Tests/Invoke-V321RetainedTests.ps1'
          )
          foreach ($test in $tests) {
            & pwsh -NoProfile -File $test
            if ($LASTEXITCODE -ne 0) { throw "Regression test failed: $test (exit $LASTEXITCODE)" }
          }

      - name: Validate upgrade identity and timing on Windows PowerShell 5.1
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./Tests/Invoke-UpgradeIdentityTests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PS5 identity fixtures failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./Tests/Invoke-V320ReportTests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PS5 real collector/export fixtures failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./Tests/Invoke-V320MigrationTests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PS5 migration fixtures failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./Tests/Invoke-V320MigrationTests.ps1 -PreviousEngine 3.2.0
          if ($LASTEXITCODE -ne 0) { throw 'PS5 3.2.0-to-3.2.1 migration fixtures failed.' }
          $retainedOutput = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./Tests/Invoke-V321RetainedTests.ps1)
          $retainedOutput | Write-Output
          if ($LASTEXITCODE -ne 0) { throw 'PS5 retained-log/timestamp fixtures failed.' }
          $reportLine = $retainedOutput | Where-Object { $_ -like 'PASS: retained-log report fixture: *' } | Select-Object -Last 1
          if (-not $reportLine) { throw 'No actual exported report path was returned by the PS5 fixture.' }
          $exportedReport = $reportLine.Substring('PASS: retained-log report fixture: '.Length)
          dotnet run --project ./Tests/UpdateCore.Tests/UpdateCore.Tests.csproj --configuration Release -- --verify-report $exportedReport
          if ($LASTEXITCODE -ne 0) { throw 'Actual PS5 report failed the production GUI completion check.' }

      - name: Validate updater integrity and failure scenarios
        shell: pwsh
        run: |
          dotnet run --project ./Tests/UpdateCore.Tests/UpdateCore.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Updater security fixtures failed.' }

      - name: Validate native GUI layout and render snapshots
        shell: pwsh
        run: |
          dotnet run --project ./Tests/Gui.LayoutTests/Gui.LayoutTests.csproj --configuration Release -- ./gui-layout-results
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI layout validation failed.' }

      - name: Upload GUI validation snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WUPA-GUI-layout-validation
          path: gui-layout-results/
          if-no-files-found: warn

      - name: Publish x64 and ARM64 single-file applications
        shell: pwsh
        run: ./Build/Build-WindowsExecutables.ps1 -RuntimeIdentifiers win-x64,win-arm64

      - name: Verify actual portable executable startup and embedded payload
        shell: powershell
        run: ./Tests/Invoke-PortableExeSmokeTest.ps1

      - name: Build unsigned update artifacts for offline signing
        shell: pwsh
        run: ./Build/Create-UpdateRelease.ps1

      - name: Build portable GUI validation harness for Windows VM checks
        shell: pwsh
        run: |
          dotnet publish ./Tests/Gui.LayoutTests/Gui.LayoutTests.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output ./gui-vm-harness
          if ($LASTEXITCODE -ne 0) { throw 'GUI VM harness build failed.' }

      - uses: actions/upload-artifact@v4
        with:
          name: WUPA-GUI-VM-harness
          path: gui-vm-harness/Gui.LayoutTests.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: WUPA-3.2.1
          path: |
            dist/*.exe
            dist/*.json
            dist/*.sha256
            dist/*.zip
          if-no-files-found: error
